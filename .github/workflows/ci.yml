# .github/workflows/ci.yml
name: CI

# 触发条件：push 到 main/master 分支，或创建 PR
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 并发控制：同一分支的新 push 会取消之前的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== 质量检查 Job ==========
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript 类型检查
      - name: Type Check
        run: npm run typecheck

      # 5. ESLint 代码检查
      - name: Lint
        run: npm run lint

      # 6. Prettier 格式检查
      - name: Format Check
        run: npm run format:check

      # 7. 运行测试
      - name: Test
        run: npm run test

      # 8. 生产构建
      - name: Build
        run: npm run build

      # 9. 上传构建产物（可选，用于部署）
      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
